name: Code Coverage Report.

on:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
      - 'release/**'
  pull_request:
    branches:
      - main
      - 'release/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 3
  RUSTUP_MAX_RETRIES: 3
  # Pinned so a coverage run is reproducible and so the cache key below has
  # something stable to key on. Bump both together.
  TARPAULIN_VERSION: '0.37.0'

jobs:
  code_coverage_report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # One toolchain step. The previous job piped curl into sh inside a retry
      # action, then declared an `if: failure()` fallback that could never run,
      # then verified the install with a `source ~/.cargo/env || true`.
      - name: Install Rust
        # dtolnay/rust-toolchain 1.14
        uses: dtolnay/rust-toolchain@e28255f972c9d51d5aeb20d5d79f4f98858dad35
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Cache Rust dependencies
        # actions/cache v4
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-coverage-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-coverage-

      # cargo-tarpaulin was rebuilt from source on every run, which dominated
      # the job. It is now pinned and cached on its own key, so it is compiled
      # once per version rather than once per push.
      - name: Cache cargo-tarpaulin
        id: cache-tarpaulin
        # actions/cache v4
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cargo/bin/cargo-tarpaulin
          key: ${{ runner.os }}-tarpaulin-${{ env.TARPAULIN_VERSION }}

      - name: Install cargo-tarpaulin
        if: steps.cache-tarpaulin.outputs.cache-hit != 'true'
        run: cargo install cargo-tarpaulin --version ${{ env.TARPAULIN_VERSION }} --locked

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y make

      - name: Generate code coverage report
        run: >
          cargo tarpaulin --color Always --engine llvm --verbose --tests
          --all-targets --all-features --workspace --timeout 0 --out Xml

      - name: Upload coverage reports to Codecov.io
        # codecov/codecov-action v5
        uses: codecov/codecov-action@04b047e8bb82a0c002c8312c1c880fbc6a999d45
        with:
          fail_ci_if_error: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
