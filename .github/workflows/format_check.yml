name: Format Check

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - 'release/**'

permissions:
  contents: read

concurrency:
  group: format-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  format_check:
    runs-on: ubuntu-latest
    
    steps:
      - # actions/checkout v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Rust
        # dtolnay/rust-toolchain master (the generic action; the version branches
        # such as `1.14` hardcode that Rust release and reject a `toolchain` input)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        # actions/cache v4
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-fmt-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-fmt-

      - name: Install make
        run: sudo apt-get install make

      # `make fmt` rewrites the files and then succeeds, so this job used to
      # pass on unformatted input. `make fmt-check` reports instead.
      - name: Format check
        run: make fmt-check