name: Build

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - 'release/**'

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_RETRY: 3
  RUSTUP_MAX_RETRIES: 3

jobs:
  # Portability. The crate is pure Rust over rust_decimal with no platform
  # code, so one job per supported OS family is enough to catch a regression;
  # the previous matrix ran two Ubuntu versions, which tested nothing the other
  # did not.
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    steps:
      - name: Checkout
        # actions/checkout v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # One toolchain step, no curl, no retry wrapper, no failure-only
      # fallback. The previous job installed rustup by piping curl into sh
      # inside a retry action, then ran a second setup step, then declared a
      # fallback `if: failure()` that could never run because the steps before
      # it had already failed the job.
      - name: Install Rust
        # dtolnay/rust-toolchain master (the generic action; the version branches
        # such as `1.14` hardcode that Rust release and reject a `toolchain` input)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        id: toolchain
        with:
          toolchain: stable

      - name: Cache Rust dependencies
        # actions/cache v4
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          # Keyed on the toolchain as well as the manifest: a cache built by a
          # different rustc cannot be reused, and the previous key omitted it.
          # `cachekey` comes from the `id: toolchain` step above — without that
          # id the expression expands empty and the scoping silently does
          # nothing. The restore key carries the toolchain too, so a partial
          # restore cannot cross toolchains either.
          # ~/.cargo/bin is no longer cached, so a stale binary cannot shadow a
          # pinned install.
          key: ${{ runner.os }}-build-${{ steps.toolchain.outputs.cachekey }}-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-build-${{ steps.toolchain.outputs.cachekey }}-

      - name: Build
        run: cargo build --all-features --all-targets

  # Minimum supported Rust version. `rust-version` in Cargo.toml is a promise
  # to consumers, so it is verified rather than asserted.
  #
  # The library only: `cargo test` additionally pulls in criterion, which
  # requires 1.86 and is a dev-dependency, so it does not constrain anyone
  # depending on this crate.
  msrv:
    name: msrv (1.85, library)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout v4
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install MSRV toolchain
        # dtolnay/rust-toolchain master (the generic action; the version branches
        # such as `1.14` hardcode that Rust release and reject a `toolchain` input)
        uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772
        with:
          toolchain: '1.85'

      - name: Cache Rust dependencies
        # actions/cache v4
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target/
          key: ${{ runner.os }}-msrv-1.85-${{ hashFiles('**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-msrv-1.85-

      # `+1.85` overrides rust-toolchain.toml, which pins `stable` for local
      # development; without it cargo would silently use stable here and the
      # job would prove nothing.
      # Printed and asserted, not assumed. rust-toolchain.toml pins `stable`
      # for local development and silently overrides whatever the runner has
      # installed, so without the `+1.85` override and this check the job
      # would go green while compiling on stable and proving nothing.
      - name: Confirm the toolchain really is 1.85
        run: |
          rustc +1.85 --version
          rustc +1.85 --version | grep -q '^rustc 1\.85\.' \
            || { echo "MSRV job is not running on 1.85"; exit 1; }

      - name: Check the library at MSRV, in every feature configuration
        run: |
          cargo +1.85 check --lib --all-features
          cargo +1.85 check --lib --no-default-features
          cargo +1.85 check --lib --features non-zero
